[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-tuner"
version = "0.1.0"
description = "STM32 PID tuner protocol verification tools"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "PySide6>=6.6", "pyqtgraph>=0.13"]

[project.scripts]
pid-tuner = "pid_tuner.cli:main"
pid-tuner-gui = "pid_tuner.gui.app:main"

[tool.setuptools.packages.find]
include = ["pid_tuner*"]
