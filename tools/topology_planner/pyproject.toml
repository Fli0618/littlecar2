[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlecar-topology-planner"
version = "0.1.0"
description = "LittleCar2 比赛场地拓扑路径规划工具"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6"]

[project.scripts]
littlecar-topology-planner = "topology_planner.gui:main"

[tool.setuptools.packages.find]
include = ["topology_planner*"]
