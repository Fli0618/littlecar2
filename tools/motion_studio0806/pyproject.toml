[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-studio0806"
version = "0.1.0"
description = "LittleCar2 底盘运动 Studio 调试工作台 (0806 重构版)"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6", "pyqtgraph>=0.13", "pyserial>=3.5"]

[project.scripts]
motion-studio0806 = "motion_studio0806.app:main"

[tool.setuptools.packages.find]
include = ["motion_studio0806*"]
